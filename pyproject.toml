[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "EXE"]

[tool.ruff.lint.per-file-ignores]
# Basic and Intermediate tiers intentionally defer shebangs per docs/02_engineering_guidelines.md
"code/01_basic/*.py" = ["EXE002"]
"code/02_intermediate/*.py" = ["EXE002"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
